name: ci

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell
          - os: windows-latest
            shell: pwsh
          - os: ubuntu-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 4 and PSScriptAnalyzer
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 4.10.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: PSScriptAnalyzer
        run: |
          $r = Invoke-ScriptAnalyzer -Path ./WAservix -Recurse -Severity Warning,Error
          $r | Format-Table -AutoSize | Out-String | Write-Host
          if ($r | Where-Object Severity -eq 'Error') { throw 'PSScriptAnalyzer errors' }
      - name: Tests
        run: |
          Import-Module Pester -RequiredVersion 4.10.1
          $res = Invoke-Pester -Path ./tests -PassThru
          if ($res.FailedCount -gt 0) { throw "$($res.FailedCount) test(s) failed" }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches the manifest version
        shell: pwsh
        run: |
          $v = (Import-PowerShellDataFile ./WAservix/WAservix.psd1).ModuleVersion
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match ModuleVersion $v" }
      - name: Publish to the PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: Publish-Module -Path ./WAservix -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose
